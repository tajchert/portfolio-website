<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>mtajchert.com share card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #fff; color: #334155; font-family: Verdana, Geneva, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 22px 64px; background: #EEF1F5; border-bottom: 2px solid #D8DEE6; font-size: 26px; color: #0F172A; }
  .identity { display: flex; align-items: center; gap: 18px; }
  .identity img { width: 44px; height: 44px; }
  .domain { color: #5B6778; }
  main { flex: 1; padding: 0 64px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  h1 { margin: 0; font-size: 96px; line-height: 1.1; font-weight: 700; letter-spacing: -3px; color: #0F172A; }
  p { margin: 0; font-size: 32px; line-height: 1.4; color: #5B6778; }
  .accent { height: 10px; background: #2563EB; }
</style>
<header>
  <div class="identity"><img src="../site/favicon.svg" alt=""><span>personal page</span></div>
  <span class="domain">mtajchert.com</span>
</header>
<main>
  <h1>Michał Tajchert</h1>
  <p>CTO in Warsaw. I learn by building.</p>
</main>
<div class="accent" aria-hidden="true"></div>
</html>
