<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Michał Tajchert</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A23" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
(function () {
  var d = document.documentElement, key = 'theme', bars = { light: '#EEF1F5', dark: '#151A23' };
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function current() { return d.getAttribute('data-theme') || (mq && mq.matches ? 'dark' : 'light'); }
  function apply(t) {
    d.setAttribute('data-theme', t);
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', bars[t]);
  }
  function label() {
    var b = document.getElementById('theme');
    if (!b) return;
    var text = current() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    b.setAttribute('aria-label', text);
    b.setAttribute('title', text);
  }
  try { var saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') apply(saved); } catch (e) {}
  d.className += ' js';
  document.addEventListener('DOMContentLoaded', label);
  if (mq && mq.addEventListener) mq.addEventListener('change', label);
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#theme')) return;
    var next = current() === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem(key, next); } catch (err) {}
    label();
  });
})();
</script>
<style>
:root {
  --bg: #FFFFFF; --text: #334155; --strong: #0F172A; --muted: #5B6778;
  --bar: #EEF1F5; --bar-line: #D8DEE6; --accent: #2563EB;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E14; --text: #CBD5E1; --strong: #F1F5F9; --muted: #94A3B8;
    --bar: #151A23; --bar-line: #2E3440; --accent: #8AB4FF;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E14; --text: #CBD5E1; --strong: #F1F5F9; --muted: #94A3B8;
  --bar: #151A23; --bar-line: #2E3440; --accent: #8AB4FF;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 0.8125rem/1.5 Verdana, Geneva, sans-serif; }
h1, p { margin: 0; }
a { color: var(--strong); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.page { max-width: 920px; margin: 0 auto; padding: 12px 16px 48px; }
.bar { padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--bar-line); }
.bar a { font-weight: 700; }
main { padding: 20px 10px 0; }
h1 { font-size: 1rem; line-height: 1.4; color: var(--strong); }
p { margin-top: 8px; }
main a { color: var(--accent); text-decoration: underline; }
@media (max-width: 719px) {
  .page { padding: 0 0 40px; }
  .bar { padding: 0 12px; }
  .bar a { display: inline-block; padding: 12px 0; font-size: 0.875rem; }
  main { padding: 18px 12px 0; }
}
</style>
</head>
<body>
<div class="page">
<header class="bar"><a href="/">Michał Tajchert</a></header>
<main>
  <h1>Page not found</h1>
  <p>There is nothing at this address. Go to the <a href="/">home page</a>.</p>
</main>
</div>
</body>
</html>
